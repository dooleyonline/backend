basePath: /
definitions:
  authsvc.LoginParams:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  http.Header:
    additionalProperties:
      items:
        type: string
      type: array
    type: object
  itemsvc.MutationParams:
    properties:
      category:
        type: string
      condition:
        type: integer
      description:
        type: string
      images:
        items:
          type: string
        type: array
      is_negotiable:
        type: boolean
      name:
        type: string
      price:
        type: number
      subcategory:
        type: string
    type: object
  model.Category:
    properties:
      icon:
        type: string
      name:
        type: string
      subcategory:
        items:
          type: string
        type: array
    type: object
  model.ChatMessage:
    properties:
      body:
        type: string
      edited:
        type: boolean
      id:
        type: integer
      room_id:
        type: string
      sent_at:
        type: string
      sent_by:
        type: string
    type: object
  model.ChatParticipant:
    properties:
      last_read_message_id:
        $ref: '#/definitions/pgtype.Int8'
      room_id:
        type: string
      user_id:
        type: string
    type: object
  model.Item:
    properties:
      category:
        type: string
      condition:
        type: integer
      description:
        type: string
      fts:
        type: string
      id:
        type: integer
      images:
        items:
          type: string
        type: array
      is_negotiable:
        type: boolean
      likes:
        type: integer
      name:
        type: string
      placeholder:
        type: string
      posted_at:
        type: string
      price:
        type: number
      seller:
        type: string
      sold_at:
        type: string
      subcategory:
        type: string
      views:
        type: integer
    type: object
  model.User:
    properties:
      avatar:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      liked_items:
        items:
          type: integer
        type: array
      password:
        type: string
    type: object
  pgtype.Int8:
    properties:
      int64:
        format: int64
        type: integer
      valid:
        type: boolean
    type: object
  storage.PresignResult:
    properties:
      headers:
        $ref: '#/definitions/http.Header'
      image_id:
        type: string
      url:
        type: string
    type: object
  usersvc.CreateParams:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      password:
        type: string
    type: object
  usersvc.UpdateAvatarParams:
    properties:
      avatar_id:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is the REST API for DooleyOnline.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: DooleyOnline API
  version: "1.0"
paths:
  /:
    get:
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Greeting
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login Params
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/authsvc.LoginParams'
      produces:
      - application/json
      responses:
        "200":
          description: User
          schema:
            $ref: '#/definitions/model.User'
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Log out
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.User'
        "401":
          description: Unauthorized
      summary: Get current authenticated user
      tags:
      - auth
  /category:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Category'
            type: array
      summary: Get all categories
      tags:
      - category
  /category/{name}:
    get:
      parameters:
      - description: Category name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Category'
      summary: Get category by name
      tags:
      - category
  /chat/{roomID}:
    delete:
      parameters:
      - description: Room ID
        in: path
        name: roomID
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete a chat room
      tags:
      - chat
  /chat/{roomID}/messages:
    get:
      parameters:
      - description: Room ID
        in: path
        name: roomID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.ChatMessage'
            type: array
      summary: Get latest messages
      tags:
      - chat
  /chat/{roomID}/participants:
    get:
      parameters:
      - description: Room ID
        in: path
        name: roomID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.ChatParticipant'
            type: array
      summary: Get participants in a chat room
      tags:
      - chat
  /chat/{roomID}/participants/{userID}:
    delete:
      parameters:
      - description: Room ID
        in: path
        name: roomID
        required: true
        type: string
      - description: User ID
        in: path
        name: userID
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Remove a user from a chat room
      tags:
      - chat
    post:
      parameters:
      - description: Room ID
        in: path
        name: roomID
        required: true
        type: string
      - description: User ID
        in: body
        name: userID
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
      summary: Add a user to a chat room
      tags:
      - chat
  /chat/{roomID}/ws:
    get:
      parameters:
      - description: Room ID
        in: path
        name: roomID
        required: true
        type: string
      responses:
        "200":
          description: OK
      summary: Handle WebSocket connections
      tags:
      - chat
  /chat/messages/{messageID}:
    delete:
      parameters:
      - description: Message ID
        format: int64
        in: path
        name: messageID
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      summary: Delete a message
      tags:
      - chat
    patch:
      parameters:
      - description: Message ID
        format: int64
        in: path
        name: messageID
        required: true
        type: integer
      - description: New message body
        in: body
        name: body
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
      summary: Edit an existing message
      tags:
      - chat
  /chat/rooms:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.ChatParticipant'
            type: array
      summary: Get chat rooms for a user
      tags:
      - chat
    post:
      parameters:
      - description: User IDs
        in: body
        name: userIDs
        required: true
        schema:
          items:
            type: string
          type: array
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: string
      summary: Create a new room
      tags:
      - chat
  /item:
    get:
      parameters:
      - description: Seller filter
        in: query
        name: seller
        type: string
      - description: Search query
        in: query
        name: q
        type: string
      - description: Category filter
        in: query
        name: category
        type: string
      - description: Page number
        format: int32
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Item'
            type: array
      summary: Get many items
      tags:
      - item
    post:
      consumes:
      - application/json
      parameters:
      - description: Item
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/itemsvc.MutationParams'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Item'
      summary: Create item
      tags:
      - item
  /item/{id}:
    delete:
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      summary: Delete item by ID
      tags:
      - item
    get:
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Item'
      summary: Get item by ID
      tags:
      - item
    put:
      consumes:
      - application/json
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      - description: Item
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/itemsvc.MutationParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Item'
      summary: Update item by ID
      tags:
      - item
  /item/{id}/like:
    post:
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      summary: Like an item
      tags:
      - item
  /item/{id}/sell:
    post:
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      summary: Update sold_at property by ID
      tags:
      - item
  /item/{id}/unlike:
    post:
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      summary: Unlike an item
      tags:
      - item
  /item/{id}/view:
    post:
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      summary: Increment item views by ID
      tags:
      - item
  /item/batch:
    post:
      consumes:
      - application/json
      parameters:
      - description: Item IDs
        in: body
        name: item_IDs
        required: true
        schema:
          items:
            type: integer
          type: array
      - description: Page number
        format: int32
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Item'
            type: array
      summary: Get items in bulk by list of IDs
      tags:
      - item
  /storage/presign:
    post:
      consumes:
      - application/json
      parameters:
      - description: Content type of the item to be uploaded
        in: query
        name: type
        required: true
        type: string
      - description: Storage bucket name
        in: query
        name: bucket
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/storage.PresignResult'
      summary: Generate presigned URL for item upload
      tags:
      - util
  /user:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.User'
            type: array
      summary: Get many users
      tags:
      - user
    post:
      consumes:
      - application/json
      parameters:
      - description: User
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/usersvc.CreateParams'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.User'
      summary: Create user
      tags:
      - user
  /user/{id}:
    get:
      parameters:
      - description: User ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.User'
      summary: Get seller by ID
      tags:
      - user
  /user/avatar:
    put:
      consumes:
      - application/json
      parameters:
      - description: Avatar ID (UUID)
        in: body
        name: avatar
        required: true
        schema:
          $ref: '#/definitions/usersvc.UpdateAvatarParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Update user avatar
      tags:
      - user
swagger: "2.0"
