basePath: /
definitions:
  authsvc.LoginParams:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  categorydb.Category:
    properties:
      icon:
        type: string
      name:
        type: string
      subcategory:
        items:
          type: string
        type: array
    type: object
  itemdb.Item:
    properties:
      category:
        type: string
      condition:
        type: integer
      description:
        type: string
      fts:
        type: string
      id:
        type: integer
      images:
        items:
          type: string
        type: array
      is_negotiable:
        type: boolean
      likes:
        type: integer
      name:
        type: string
      placeholder:
        type: string
      posted_at:
        type: string
      price:
        type: number
      seller:
        type: string
      sold_at:
        type: string
      subcategory:
        type: string
      views:
        type: integer
    type: object
  itemsvc.CreateUpdateInput:
    properties:
      category:
        type: string
      condition:
        type: integer
      description:
        type: string
      images:
        items:
          type: string
        type: array
      is_negotiable:
        type: boolean
      name:
        type: string
      price:
        type: number
      subcategory:
        type: string
    type: object
  storage.PresignRequest:
    properties:
      bucket:
        type: string
      contentType:
        type: string
      key:
        type: string
      method:
        type: string
    type: object
  userdb.User:
    properties:
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      liked_items:
        items:
          type: integer
        type: array
      password:
        type: string
    type: object
  usersvc.CreateInput:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      password:
        type: string
    type: object
  usersvc.Me:
    properties:
      email:
        type: string
      firstName:
        type: string
      id:
        type: string
      lastName:
        type: string
      likedItems:
        items:
          format: int64
          type: integer
        type: array
    type: object
  usersvc.Seller:
    properties:
      firstName:
        type: string
      id:
        type: string
      lastName:
        type: string
    type: object
  usersvc.UserSummary:
    properties:
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is the REST API for DooleyOnline.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: DooleyOnline API
  version: "1.0"
paths:
  /:
    get:
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Greeting
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login Params
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/authsvc.LoginParams'
      produces:
      - application/json
      responses:
        "200":
          description: User
          schema:
            $ref: '#/definitions/userdb.User'
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: Result
          schema:
            type: string
      summary: Log out
      tags:
      - auth
  /category:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/categorydb.Category'
            type: array
      summary: Get all categories
      tags:
      - category
  /category/{name}:
    get:
      parameters:
      - description: Category name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/categorydb.Category'
      summary: Get category by name
      tags:
      - category
  /item:
    get:
      parameters:
      - description: Seller filter
        in: query
        name: seller
        type: string
      - description: Search query
        in: query
        name: q
        type: string
      - description: Category filter
        in: query
        name: category
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/itemdb.Item'
            type: array
      summary: Get many items
      tags:
      - item
    post:
      consumes:
      - application/json
      parameters:
      - description: Item
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/itemsvc.CreateUpdateInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/itemdb.Item'
      summary: Create item
      tags:
      - item
  /item/{id}:
    delete:
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      summary: Delete item by ID
      tags:
      - item
    get:
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/itemdb.Item'
      summary: Get item by ID
      tags:
      - item
    put:
      consumes:
      - application/json
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      - description: Item
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/itemsvc.CreateUpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/itemdb.Item'
      summary: Update item by ID
      tags:
      - item
  /item/{id}/like:
    post:
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: Updated liked items
          schema:
            items:
              format: int64
              type: integer
            type: array
      summary: Like an item
      tags:
      - item
  /item/{id}/sell:
    post:
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      summary: Update sold_at property by ID
      tags:
      - item
  /item/{id}/unlike:
    post:
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: Updated liked items
          schema:
            items:
              format: int64
              type: integer
            type: array
      summary: Unlike an item
      tags:
      - item
  /item/{id}/view:
    post:
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      summary: Increment item views by ID
      tags:
      - item
  /item/bulk:
    post:
      consumes:
      - application/json
      parameters:
      - description: Item IDs
        in: body
        name: item_IDs
        required: true
        schema:
          items:
            type: integer
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/itemdb.Item'
            type: array
      summary: Get items in bulk by list of IDs
      tags:
      - item
  /storage/presign:
    post:
      consumes:
      - application/json
      parameters:
      - description: Presign params
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/storage.PresignRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/itemdb.Item'
      summary: Generate presigned URL for s3 operation
      tags:
      - other
  /user:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/usersvc.UserSummary'
            type: array
      summary: Get many users
      tags:
      - user
    post:
      consumes:
      - application/json
      parameters:
      - description: User
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/usersvc.CreateInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/usersvc.UserSummary'
      summary: Create user
      tags:
      - user
  /user/{id}:
    get:
      parameters:
      - description: User ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usersvc.Seller'
      summary: Get seller by ID
      tags:
      - user
  /user/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usersvc.Me'
      security:
      - ApiKeyAuth: []
      summary: Get current authenticated user
      tags:
      - user
swagger: "2.0"
