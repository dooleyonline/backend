version: "2"

servers:
  - engine: "postgresql"
    uri: ${DATABASE_URL}

sql:
  - engine: "postgresql"
    database:
      managed: true
    queries: "sqlc/item/item/query.sql"
    schema: "sqlc/item/item/schema.sql"
    gen:
      go:
        package: "itemitem"
        out: "internal/db/item/item"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true

  - engine: "postgresql"
    database:
      managed: true
    queries: "sqlc/item/category/query.sql"
    schema: "sqlc/item/category/schema.sql"
    gen:
      go:
        package: "itemcategory"
        out: "internal/db/item/category"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true

  - engine: "postgresql"
    database:
      managed: true
    queries: "sqlc/user/user/query.sql"
    schema: "sqlc/user/user/schema.sql"
    gen:
      go:
        package: "useruser"
        out: "internal/db/user/user"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true

  - engine: "postgresql"
    database:
      managed: true
    queries: "sqlc/chat/message/query.sql"
    schema: "sqlc/chat/message/schema.sql"
    gen:
      go:
        package: "chatmessage"
        out: "internal/db/chat/message"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true

  - engine: "postgresql"
    database:
      managed: true
    queries: "sqlc/chat/room/query.sql"
    schema: "sqlc/chat/room/schema.sql"
    gen:
      go:
        package: "chatroom"
        out: "internal/db/chat/room"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true

  - engine: "postgresql"
    database:
      managed: true
    queries: "sqlc/chat/participant/query.sql"
    schema: "sqlc/chat/participant/schema.sql"
    gen:
      go:
        package: "chatparticipant"
        out: "internal/db/chat/participant"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true

  - engine: "postgresql"
    database:
      managed: true
    queries: "sqlc/user/liked/query.sql"
    schema: "sqlc/user/liked/schema.sql"
    gen:
      go:
        package: "userliked"
        out: "internal/db/user/liked"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true

  - engine: "postgresql"
    database:
      managed: true
    queries: "sqlc/user/viewed/query.sql"
    schema: "sqlc/user/viewed/schema.sql"
    gen:
      go:
        package: "userviewed"
        out: "internal/db/user/viewed"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true

overrides:
  go:
    overrides:
      - db_type: "pg_catalog.timestamptz"
        go_type:
          import: "time"
          type: "Time"
          pointer: false
      - db_type: "pg_catalog.timestamptz"
        go_type:
          import: "time"
          type: "Time"
          pointer: true
        nullable: true
      - db_type: "uuid"
        go_type: "string"
      - column: item.id
        go_struct_tag: 'param:"id"'
      - column: "item.item.fts"
        go_type: "string"
