version: "2"
servers:
  - engine: "postgresql"
    uri: ${DATABASE_URL}
sql:
  - engine: "postgresql"
    database:
      managed: true
    queries: "sqlc/item/query.sql"
    schema: "sqlc/item/schema.sql"
    gen:
      go:
        package: "itemdb"
        out: "internal/db/item"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
  - engine: "postgresql"
    database:
      managed: true
    queries: "sqlc/category/query.sql"
    schema: "sqlc/category/schema.sql"
    gen:
      go:
        package: "categorydb"
        out: "internal/db/category"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
  - engine: "postgresql"
    database:
      managed: true
    queries: "sqlc/user/query.sql"
    schema: "sqlc/user/schema.sql"
    gen:
      go:
        package: "userdb"
        out: "internal/db/user"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
overrides:
  go:
    overrides:
      - db_type: "pg_catalog.timestamptz"
        go_type:
          import: "time"
          type: "Time"
          pointer: false
      - db_type: "pg_catalog.timestamptz"
        go_type:
          import: "time"
          type: "Time"
          pointer: true
        nullable: true
      - db_type: "uuid"
        go_type: "string"
      - column: item.id
        go_struct_tag: 'param:"id"'
      - column: "item.fts"
        go_type: "string"
