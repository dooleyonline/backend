version: "2"
servers:
  - engine: "postgresql"
    uri: ${DATABASE_URL}
sql:
  - engine: "postgresql"
    database:
      managed: true
    queries: "sql/item/query.sql"
    schema: "sql/item/schema.sql"
    gen:
      go:
        package: "sql"
        out: "sql"
        sql_package: "pgx/v5"
overrides:
  go:
    overrides:
      - db_type: "pg_catalog.timestamptz"
        go_type: "time.Time"
      - db_type: "pg_catalog.timestamptz"
        nullable: true
        go_type: "*time.Time"
