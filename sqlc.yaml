version: "2"
# servers:
#   - engine: "postgresql"
#     uri: ${DATABASE_URL}
sql:
  - engine: "postgresql"
    # database:
    #   managed: true
    queries: "sql/item/query.sql"
    schema:
      - "sql/item/schema.sql"
    gen:
      go:
        package: "item"
        out: "sql/item"
        sql_package: "pgx/v5"
        emit_json_tags: true
  - engine: "postgresql"
    # database:
    #   managed: true
    queries: "sql/category/query.sql"
    schema: "sql/category/schema.sql"
    gen:
      go:
        package: "category"
        out: "sql/category"
        sql_package: "pgx/v5"
        emit_json_tags: true
  - engine: "postgresql"
    # database:
    #   managed: true
    queries: "sql/user/query.sql"
    schema: "sql/user/schema.sql"
    gen:
      go:
        package: "user"
        out: "sql/user"
        sql_package: "pgx/v5"
        emit_json_tags: true

overrides:
  go:
    overrides:
      - db_type: "pg_catalog.timestamptz"
        go_type:
          import: "time"
          type: "Time"
          pointer: false
      - db_type: "pg_catalog.timestamptz"
        go_type:
          import: "time"
          type: "Time"
          pointer: true
        nullable: true
      - column: item.id
        go_struct_tag: 'param:"id"'
      - column: "item.fts"
        go_type: "string"
